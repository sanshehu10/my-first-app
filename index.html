<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My First App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>My First App</h1>
      <p class="description">
        Welcome! This beginner app lets you create a to-do list and keep track of what you finish.
      </p>

      <section class="todo-card" aria-label="To-do list">
        <h2>To-Do List</h2>
        <form id="todo-form" class="todo-form">
          <label for="todo-input" class="sr-only">New to-do item</label>
          <input id="todo-input" type="text" placeholder="Add a new task" required />
          <button type="submit">Add</button>
        </form>
        <ul id="todo-list" class="todo-list"></ul>
      </section>
    </main>

    <template id="todo-item-template">
      <li class="todo-item">
        <label>
          <input type="checkbox" class="complete-checkbox" />
          <span class="todo-text"></span>
        </label>
        <button type="button" class="delete-btn">Delete</button>
      </li>
    </template>

    <script src="script.js"></script>
  </body>
</html>
